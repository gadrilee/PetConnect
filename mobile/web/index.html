<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="AlquilaMatch: alquiler con las condiciones por delante.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="alquilamatch">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>AlquilaMatch</title>
  <meta name="theme-color" content="#1B7A3E">
  <link rel="manifest" href="manifest.json">

  <!-- CanvasKit y la tipografía vienen de dos servidores de Google, y el
       navegador recién se entera de que existen cuando ejecuta el bootstrap.
       Avisándole acá, va abriendo la conexión (DNS, TCP y TLS) mientras
       todavía está bajando lo nuestro, en vez de después. -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Lo mismo con el bulto de la app: main.dart.js son 930 KB y hasta ahora
       se pedía recién cuando flutter_bootstrap.js terminaba de ejecutarse.
       Así arranca en paralelo. -->
  <link rel="preload" href="main.dart.js" as="script">

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #FFFFFF; }

    /* Un h1 para el lector de pantalla, que no se ve.
       La app se dibuja en un canvas y su arbol de accesibilidad empieza en
       h2, asi que la pagina no tenia encabezado de primer nivel. No se usa
       display:none, que lo sacaria tambien del arbol. */
    .solo-lectores {
      position: absolute; width: 1px; height: 1px;
      margin: -1px; padding: 0; overflow: hidden;
      clip: rect(0 0 0 0); clip-path: inset(50%); border: 0;
    }

    /* Mientras bajan los 930 KB de la app la pantalla estaba en blanco. Con
       el logo y el nombre, la espera se entiende. */
    #cargando {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px; font-family: system-ui, -apple-system, sans-serif;
      transition: opacity .2s ease-out;
    }
    #cargando img { width: 96px; height: auto; }
    #cargando p { margin: 0; color: #6B6B6B; font-size: 14px; }
    #cargando strong { color: #1B7A3E; font-size: 22px; font-weight: 700; }
  </style>
</head>

  <script>
    // El motor de Flutter usa `Intl.v8BreakIterator` para partir palabras y
    // renglones, y esa API está deprecada: es lo único que le quedaba en rojo
    // a Lighthouse en "buenas prácticas", y no se arregla desde el código de
    // la app ni actualizando Flutter (se probó con 3.47.5).
    //
    // Pero el engine la elige por detección de capacidades: si no está, usa su
    // propio partidor en Dart. Y ese camino no es experimental — es el que
    // usan Firefox y Safari, que nunca tuvieron `v8BreakIterator` porque es
    // exclusiva de V8. Sacándola, Chrome queda en la misma vía que ellos.
    //
    // Cuando Flutter pase a `Intl.Segmenter` aguas arriba, esto se puede
    // borrar sin más.
    try { delete Intl.v8BreakIterator; } catch (e) {}

    // Flutter avisa cuando pinto su primer cuadro: ahi recien se saca el
    // cartel, para que no haya un parpadeo en blanco entre los dos.
    window.addEventListener('flutter-first-frame', function () {
      var cartel = document.getElementById('cargando');
      if (cartel) {
        cartel.style.opacity = '0';
        setTimeout(function () { cartel.remove(); }, 200);
      }

      // La app entera es el contenido principal de la pagina, pero Flutter no
      // marca su contenedor como tal y la pagina se queda sin regiones: un
      // lector de pantalla no tiene a donde saltar. El rol no cambia nada de
      // como funciona, solo lo nombra. Si algun dia Flutter renombra este
      // elemento, no encuentra nada y no se rompe.
      var vista = document.querySelector('flutter-view');
      if (vista && !vista.getAttribute('role')) {
        vista.setAttribute('role', 'main');
      }
    });
  </script>
