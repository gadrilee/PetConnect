<svg xmlns="http://www.w3.org/2000/svg" width="360" height="800" viewBox="0 0 360 800" font-family="Inter, Arial, sans-serif">
  <!-- 04 Solicitar visita — ACCION. Andrea acepta las condiciones ANTES de
       pedir el contacto: ese es el filtro que evita el viaje perdido y los
       veinte WhatsApp repetidos. Una sola accion principal, rellena de
       oscuro; Cancelar va como secundaria, sin relleno. -->

  <rect x="0.5" y="0.5" width="359" height="799" fill="#FFFFFF" stroke="#D0D0D0"/>

  <!-- barra de estado -->
  <rect x="0" y="0" width="360" height="28" fill="#F0F0F0"/>
  <rect x="16" y="10" width="26" height="8" rx="4" fill="#C9C9C9"/>
  <rect x="306" y="10" width="12" height="8" rx="2" fill="#C9C9C9"/>
  <rect x="322" y="10" width="10" height="8" rx="2" fill="#C9C9C9"/>
  <rect x="336" y="10" width="8" height="8" rx="2" fill="#C9C9C9"/>

  <!-- barra de titulo -->
  <polyline points="28,52 21,59 28,66" fill="none" stroke="#3A3A3A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="21" y1="59" x2="34" y2="59" stroke="#3A3A3A" stroke-width="1.5" stroke-linecap="round"/>
  <text x="48" y="64" font-size="15" fill="#3A3A3A">Solicitar visita</text>

  <!-- que anuncio es (relleno + miniatura) -->
  <rect x="20" y="92" width="320" height="72" rx="8" fill="none" stroke="#BDBDBD"/>
  <rect x="32" y="104" width="48" height="48" rx="6" fill="#E8E8E8" stroke="#BDBDBD"/>
  <line x1="32" y1="104" x2="80" y2="152" stroke="#D5D5D5"/>
  <line x1="80" y1="104" x2="32" y2="152" stroke="#D5D5D5"/>
  <rect x="92" y="112" width="150" height="10" rx="5" fill="#9A9A9A"/>
  <text x="92" y="146" font-size="11" fill="#8A8A8A">Habitación · baño privado</text>

  <!-- ESTAS ACEPTANDO: las condiciones con texto real -->
  <text x="20" y="196" font-size="13" fill="#3A3A3A">Estás aceptando:</text>
  <rect x="20" y="208" width="320" height="132" rx="8" fill="none" stroke="#BDBDBD"/>

  <polyline points="36,231 41,236 50,226" fill="none" stroke="#4A4A4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="62" y="236" font-size="13" fill="#3A3A3A">800 Bs por mes, todo incluido</text>

  <polyline points="36,261 41,266 50,256" fill="none" stroke="#4A4A4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="62" y="266" font-size="13" fill="#3A3A3A">9 min caminando a la UAGRM</text>

  <polyline points="36,291 41,296 50,286" fill="none" stroke="#4A4A4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="62" y="296" font-size="13" fill="#3A3A3A">Acepta mascotas</text>

  <polyline points="36,321 41,326 50,316" fill="none" stroke="#4A4A4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="62" y="326" font-size="13" fill="#3A3A3A">Sólo señoritas</text>

  <!-- casilla de verificacion -->
  <rect x="20" y="366" width="20" height="20" rx="4" fill="#4A4A4A"/>
  <polyline points="25,376 29,380 35,372" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="52" y="381" font-size="13" fill="#3A3A3A">Acepto estas condiciones</text>
  <text x="52" y="402" font-size="11" fill="#8A8A8A">Cuando el propietario apruebe, vas a recibir</text>
  <text x="52" y="418" font-size="11" fill="#8A8A8A">su WhatsApp.</text>

  <line x1="20" y1="446" x2="340" y2="446" stroke="#E0E0E0"/>

  <!-- bloque destacado: el precio final -->
  <rect x="20" y="466" width="320" height="76" rx="8" fill="#EFEFEF" stroke="#8A8A8A"/>
  <text x="36" y="494" font-size="11" fill="#8A8A8A">Precio final</text>
  <text x="36" y="522" font-size="18" fill="#3A3A3A">800 Bs / mes</text>
  <text x="324" y="522" font-size="11" fill="#8A8A8A" text-anchor="end">todo incluido</text>

  <!-- lo que NO estas dando todavia -->
  <rect x="20" y="562" width="320" height="52" rx="8" fill="none" stroke="#BDBDBD"/>
  <rect x="34" y="578" width="16" height="16" rx="3" fill="#9A9A9A"/>
  <text x="60" y="584" font-size="11" fill="#3A3A3A">Todavía no se comparte ningún contacto,</text>
  <text x="60" y="600" font-size="11" fill="#3A3A3A">ni el tuyo ni el del propietario.</text>

  <!-- accion secundaria -->
  <rect x="20" y="646" width="320" height="44" rx="8" fill="none" stroke="#8A8A8A"/>
  <text x="180" y="673" font-size="12" fill="#4A4A4A" text-anchor="middle">Cancelar</text>

  <!-- ACCION PRINCIPAL — la unica forma rellena de oscuro -->
  <rect x="20" y="706" width="320" height="44" rx="8" fill="#4A4A4A"/>
  <text x="180" y="733" font-size="12" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">ENVIAR SOLICITUD</text>
</svg>
