<svg xmlns="http://www.w3.org/2000/svg" width="360" height="800" viewBox="0 0 360 800" font-family="Inter, Arial, sans-serif">
  <!-- 03 Anuncio — CONTENIDO. El momento clave del flujo v0.2: aca Andrea
       decide si sigue o descarta. Los cuatro datos de descarte van con texto
       real porque son el producto. Ningun contacto visible. -->

  <rect x="0.5" y="0.5" width="359" height="799" fill="#FFFFFF" stroke="#D0D0D0"/>

  <!-- barra de estado -->
  <rect x="0" y="0" width="360" height="28" fill="#F0F0F0"/>
  <rect x="16" y="10" width="26" height="8" rx="4" fill="#C9C9C9"/>
  <rect x="306" y="10" width="12" height="8" rx="2" fill="#C9C9C9"/>
  <rect x="322" y="10" width="10" height="8" rx="2" fill="#C9C9C9"/>
  <rect x="336" y="10" width="8" height="8" rx="2" fill="#C9C9C9"/>

  <!-- barra de titulo -->
  <polyline points="28,52 21,59 28,66" fill="none" stroke="#3A3A3A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="21" y1="59" x2="34" y2="59" stroke="#3A3A3A" stroke-width="1.5" stroke-linecap="round"/>
  <text x="48" y="64" font-size="15" fill="#3A3A3A">Anuncio</text>

  <!-- foto con fecha de captura (Ev. 4) -->
  <rect x="20" y="92" width="320" height="180" rx="8" fill="#E8E8E8" stroke="#BDBDBD"/>
  <line x1="20" y1="92" x2="340" y2="272" stroke="#D5D5D5"/>
  <line x1="340" y1="92" x2="20" y2="272" stroke="#D5D5D5"/>
  <rect x="30" y="238" width="96" height="24" rx="4" fill="#FFFFFF" stroke="#BDBDBD"/>
  <text x="38" y="254" font-size="11" fill="#3A3A3A">12/08/2026</text>

  <!-- titulo del anuncio (relleno) -->
  <rect x="20" y="290" width="220" height="10" rx="5" fill="#9A9A9A"/>

  <!-- LOS CUATRO DATOS DE DESCARTE, con texto real -->
  <rect x="20" y="318" width="16" height="16" rx="3" fill="#9A9A9A"/>
  <text x="46" y="331" font-size="13" fill="#3A3A3A">1.000 Bs / mes · todo incluido</text>

  <rect x="20" y="348" width="16" height="16" rx="3" fill="#9A9A9A"/>
  <text x="46" y="361" font-size="13" fill="#3A3A3A">9 min caminando a la UAGRM</text>

  <rect x="20" y="378" width="16" height="16" rx="3" fill="#9A9A9A"/>
  <text x="46" y="391" font-size="13" fill="#3A3A3A">Acepta mascotas</text>

  <rect x="20" y="408" width="16" height="16" rx="3" fill="#9A9A9A"/>
  <text x="46" y="421" font-size="13" fill="#3A3A3A">Habitación · baño privado</text>

  <line x1="20" y1="444" x2="340" y2="444" stroke="#E0E0E0"/>

  <!-- descripcion (relleno) -->
  <rect x="20" y="462" width="320" height="8" rx="4" fill="#C9C9C9"/>
  <rect x="20" y="478" width="300" height="8" rx="4" fill="#C9C9C9"/>
  <rect x="20" y="494" width="240" height="8" rx="4" fill="#C9C9C9"/>

  <!-- el contacto NO esta: se explica por que -->
  <rect x="20" y="524" width="320" height="52" rx="8" fill="none" stroke="#BDBDBD"/>
  <rect x="34" y="540" width="16" height="16" rx="3" fill="#9A9A9A"/>
  <text x="60" y="546" font-size="11" fill="#3A3A3A">El contacto del propietario se libera</text>
  <text x="60" y="562" font-size="11" fill="#3A3A3A">cuando aprueba tu solicitud.</text>

  <!-- servicios incluidos -->
  <text x="20" y="600" font-size="11" fill="#8A8A8A">Servicios incluidos</text>
  <rect x="20" y="610" width="72" height="28" rx="14" fill="none" stroke="#BDBDBD"/>
  <text x="56" y="628" font-size="11" fill="#3A3A3A" text-anchor="middle">Agua</text>
  <rect x="100" y="610" width="72" height="28" rx="14" fill="none" stroke="#BDBDBD"/>
  <text x="136" y="628" font-size="11" fill="#3A3A3A" text-anchor="middle">Luz</text>

  <!-- ubicacion -->
  <rect x="20" y="652" width="320" height="40" rx="8" fill="#E8E8E8" stroke="#BDBDBD"/>
  <text x="180" y="677" font-size="11" fill="#8A8A8A" text-anchor="middle">Ubicación aproximada</text>

  <!-- ACCION PRINCIPAL — la unica forma rellena de oscuro -->
  <rect x="20" y="706" width="320" height="44" rx="8" fill="#4A4A4A"/>
  <text x="180" y="733" font-size="12" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">SOLICITAR VISITA</text>
</svg>
