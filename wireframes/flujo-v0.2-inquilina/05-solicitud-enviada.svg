<svg xmlns="http://www.w3.org/2000/svg" width="360" height="800" viewBox="0 0 360 800" font-family="Inter, Arial, sans-serif">
  <!-- 05 Solicitud enviada — FEEDBACK. El sistema dice que ocurrio, que falta
       y ofrece la salida. Sigue sin haber contacto: la solicitud esta
       pendiente y ese es justo el punto del producto. -->

  <rect x="0.5" y="0.5" width="359" height="799" fill="#FFFFFF" stroke="#D0D0D0"/>

  <!-- barra de estado -->
  <rect x="0" y="0" width="360" height="28" fill="#F0F0F0"/>
  <rect x="16" y="10" width="26" height="8" rx="4" fill="#C9C9C9"/>
  <rect x="306" y="10" width="12" height="8" rx="2" fill="#C9C9C9"/>
  <rect x="322" y="10" width="10" height="8" rx="2" fill="#C9C9C9"/>
  <rect x="336" y="10" width="8" height="8" rx="2" fill="#C9C9C9"/>

  <!-- barra de titulo: solo cerrar -->
  <line x1="320" y1="53" x2="332" y2="65" stroke="#3A3A3A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="332" y1="53" x2="320" y2="65" stroke="#3A3A3A" stroke-width="1.5" stroke-linecap="round"/>

  <!-- icono de espera -->
  <circle cx="180" cy="180" r="44" fill="none" stroke="#8A8A8A" stroke-width="2"/>
  <line x1="180" y1="180" x2="180" y2="154" stroke="#4A4A4A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="180" y1="180" x2="199" y2="190" stroke="#4A4A4A" stroke-width="2.5" stroke-linecap="round"/>

  <!-- que ocurrio -->
  <text x="180" y="264" font-size="18" fill="#3A3A3A" text-anchor="middle">Solicitud enviada</text>
  <text x="180" y="292" font-size="13" fill="#8A8A8A" text-anchor="middle">El propietario tiene que aprobarla.</text>
  <text x="180" y="312" font-size="13" fill="#8A8A8A" text-anchor="middle">Te avisamos apenas responda.</text>

  <!-- estado -->
  <rect x="139" y="336" width="82" height="28" rx="14" fill="#EFEFEF" stroke="#8A8A8A"/>
  <text x="180" y="354" font-size="11" fill="#3A3A3A" text-anchor="middle">Pendiente</text>

  <line x1="20" y1="400" x2="340" y2="400" stroke="#E0E0E0"/>

  <!-- a que anuncio corresponde -->
  <text x="20" y="426" font-size="11" fill="#8A8A8A">Tu solicitud es para</text>
  <rect x="20" y="438" width="320" height="88" rx="8" fill="none" stroke="#BDBDBD"/>
  <rect x="32" y="450" width="64" height="64" rx="6" fill="#E8E8E8" stroke="#BDBDBD"/>
  <line x1="32" y1="450" x2="96" y2="514" stroke="#D5D5D5"/>
  <line x1="96" y1="450" x2="32" y2="514" stroke="#D5D5D5"/>
  <rect x="110" y="458" width="140" height="10" rx="5" fill="#9A9A9A"/>
  <text x="110" y="492" font-size="13" fill="#3A3A3A">800 Bs / mes · todo incluido</text>
  <text x="110" y="510" font-size="11" fill="#8A8A8A">9 min caminando · Habitación</text>

  <!-- que sigue -->
  <text x="20" y="562" font-size="11" fill="#8A8A8A">Qué sigue</text>
  <rect x="20" y="574" width="320" height="104" rx="8" fill="none" stroke="#BDBDBD"/>

  <circle cx="46" cy="600" r="9" fill="#4A4A4A"/>
  <text x="46" y="604" font-size="11" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="68" y="605" font-size="11" fill="#3A3A3A">El propietario revisa tu solicitud</text>

  <circle cx="46" cy="628" r="9" fill="none" stroke="#BDBDBD"/>
  <text x="46" y="632" font-size="11" fill="#8A8A8A" text-anchor="middle">2</text>
  <text x="68" y="633" font-size="11" fill="#8A8A8A">Si aprueba, se libera su WhatsApp</text>

  <circle cx="46" cy="656" r="9" fill="none" stroke="#BDBDBD"/>
  <text x="46" y="660" font-size="11" fill="#8A8A8A" text-anchor="middle">3</text>
  <text x="68" y="661" font-size="11" fill="#8A8A8A">Coordinás la visita por WhatsApp</text>

  <!-- ACCION PRINCIPAL — la unica forma rellena de oscuro -->
  <rect x="20" y="706" width="320" height="44" rx="8" fill="#4A4A4A"/>
  <text x="180" y="733" font-size="12" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">VOLVER A LOS RESULTADOS</text>
</svg>
