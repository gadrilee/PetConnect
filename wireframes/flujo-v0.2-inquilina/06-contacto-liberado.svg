<svg xmlns="http://www.w3.org/2000/svg" width="360" height="800" viewBox="0 0 360 800" font-family="Inter, Arial, sans-serif">
  <!-- 06 Contacto liberado — FEEDBACK y cierre del flujo v0.2. Es la UNICA
       pantalla de toda la app donde aparece un numero: el propietario ya
       aprobo, y se libera solo para Andrea. Sigue en escala de grises: el
       verde de WhatsApp es una decision de color, todavia no toca. -->

  <rect x="0.5" y="0.5" width="359" height="799" fill="#FFFFFF" stroke="#D0D0D0"/>

  <!-- barra de estado -->
  <rect x="0" y="0" width="360" height="28" fill="#F0F0F0"/>
  <rect x="16" y="10" width="26" height="8" rx="4" fill="#C9C9C9"/>
  <rect x="306" y="10" width="12" height="8" rx="2" fill="#C9C9C9"/>
  <rect x="322" y="10" width="10" height="8" rx="2" fill="#C9C9C9"/>
  <rect x="336" y="10" width="8" height="8" rx="2" fill="#C9C9C9"/>

  <!-- barra de titulo -->
  <text x="20" y="64" font-size="15" fill="#3A3A3A">Mis solicitudes</text>
  <line x1="320" y1="53" x2="332" y2="65" stroke="#3A3A3A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="332" y1="53" x2="320" y2="65" stroke="#3A3A3A" stroke-width="1.5" stroke-linecap="round"/>

  <!-- icono de verificacion -->
  <circle cx="180" cy="164" r="36" fill="#4A4A4A"/>
  <polyline points="164,164 175,175 196,153" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="180" y="238" font-size="18" fill="#3A3A3A" text-anchor="middle">Solicitud aprobada</text>
  <text x="180" y="264" font-size="13" fill="#8A8A8A" text-anchor="middle">Ya podés coordinar la visita.</text>

  <line x1="20" y1="296" x2="340" y2="296" stroke="#E0E0E0"/>

  <!-- EL CONTACTO, recien liberado — el unico de toda la app -->
  <text x="20" y="322" font-size="11" fill="#8A8A8A">Contacto liberado para vos</text>
  <rect x="20" y="334" width="320" height="96" rx="8" fill="#EFEFEF" stroke="#8A8A8A"/>
  <circle cx="60" cy="382" r="24" fill="#D5D5D5"/>
  <circle cx="60" cy="374" r="8" fill="#FFFFFF"/>
  <path d="M46 396 a14 12 0 0 1 28 0 z" fill="#FFFFFF"/>
  <text x="96" y="372" font-size="15" fill="#3A3A3A">Marta Z.</text>
  <text x="96" y="392" font-size="11" fill="#8A8A8A">Propietaria</text>
  <rect x="96" y="402" width="16" height="16" rx="3" fill="#9A9A9A"/>
  <text x="122" y="415" font-size="13" fill="#3A3A3A">70011122</text>

  <!-- el anuncio al que corresponde -->
  <text x="20" y="466" font-size="11" fill="#8A8A8A">Del anuncio</text>
  <rect x="20" y="478" width="320" height="88" rx="8" fill="none" stroke="#BDBDBD"/>
  <rect x="32" y="490" width="64" height="64" rx="6" fill="#E8E8E8" stroke="#BDBDBD"/>
  <line x1="32" y1="490" x2="96" y2="554" stroke="#D5D5D5"/>
  <line x1="96" y1="490" x2="32" y2="554" stroke="#D5D5D5"/>
  <rect x="110" y="498" width="140" height="10" rx="5" fill="#9A9A9A"/>
  <text x="110" y="532" font-size="13" fill="#3A3A3A">800 Bs / mes · todo incluido</text>
  <text x="110" y="550" font-size="11" fill="#8A8A8A">9 min caminando · Acepta mascotas</text>

  <!-- las condiciones ya aceptadas -->
  <rect x="20" y="586" width="320" height="52" rx="8" fill="none" stroke="#BDBDBD"/>
  <polyline points="36,610 41,615 50,605" fill="none" stroke="#4A4A4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="62" y="606" font-size="11" fill="#3A3A3A">Las condiciones ya están aceptadas por</text>
  <text x="62" y="622" font-size="11" fill="#3A3A3A">las dos partes. Sólo queda la fecha.</text>

  <!-- accion secundaria -->
  <rect x="20" y="654" width="320" height="40" rx="8" fill="none" stroke="#8A8A8A"/>
  <text x="180" y="679" font-size="12" fill="#4A4A4A" text-anchor="middle">Volver a los resultados</text>

  <!-- ACCION PRINCIPAL — la unica forma rellena de oscuro -->
  <rect x="20" y="706" width="320" height="44" rx="8" fill="#4A4A4A"/>
  <text x="180" y="733" font-size="12" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">ABRIR WHATSAPP</text>
  <text x="180" y="772" font-size="11" fill="#8A8A8A" text-anchor="middle">Coordiná la visita por WhatsApp.</text>
</svg>
